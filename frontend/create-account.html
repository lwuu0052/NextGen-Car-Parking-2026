<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - SmartPark</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <h1>SmartPark</h1>
      <span></span>
      <p>Car Park Management System</p>
    </div>
    <p class="tagline">Safer Parking, Smarter Tomorrow</p>
  </header>

  <main class="main-container">
    <div class="login-card">
      <h2>Create Account</h2>
      <p class="subtitle">Create a SmartPark management account</p>

      <form id="createAccountForm">
        <div class="form-group">
          <label for="newUsername">Username</label>
          <input type="text" id="newUsername" placeholder="Enter username" required>
        </div>

        <div class="form-group">
          <label for="newPassword">Password</label>
          <input type="password" id="newPassword" placeholder="Create password" required>
        </div>

        <div class="form-group">
          <label for="role">Role</label>
          <select id="role" required>
            <option value="">Select role</option>
            <option value="operator">Operator</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <p id="createAccountMessage" class="error-message"></p>
        <button type="submit" class="login-button">Create Account</button>
      </form>

      <p class="create-account">
        Already have an account?
        <a href="index.html">Login</a>
      </p>
    </div>
  </main>

  <footer>© 2026 SmartPark. All rights reserved.</footer>
  <script src="create-account.js"></script>
</body>
</html>
